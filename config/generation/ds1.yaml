# ds1 generation config — BACKBONE §8. Owned by module 02.
# Leak area ranges are PROVISIONAL until G2 calibration; record final values here (§8.1).
# Feasibility preview (pipe 4, docs/research/WNTR_FEASIBILITY.md): 2e-5→1.0%, 8e-5→4.0%, 2.5e-4→12.1%, 6e-4→25.7%, 3e-3→72.9% of mean demand.
schema_version: "1.0"
dataset_version: ds1
dataset_seed: 20261008
network_id: net_epa_tutorial_v1
sensor_layout_id: sensors_default_v1
timestep_s: 300   # single cadence (§5.3)
duration_s: 86400
fault_start_window_h: [6, 18]
leak_end_probability: 0.30
leak_end_duration_h: [2, 6]
counts:            # §8.1 (backbone/1.1.0) — 8 types, sum 1200 (D7). ds2 types are T3.
  NORMAL: 320
  HIGH_DEMAND: 100
  LOW_DEMAND: 80
  DEMAND_SHIFT: 100
  SMALL_LEAK: 150
  MEDIUM_LEAK: 200
  LARGE_LEAK: 150
  PIPE_BURST: 100
leak_area_m2:      # checked by calibration below (G2); unchanged unless a bucket median is out of band
  SMALL_LEAK: [2.0e-5, 8.0e-5]
  MEDIUM_LEAK: [8.0e-5, 2.5e-4]
  LARGE_LEAK: [2.5e-4, 6.0e-4]
  PIPE_BURST: [1.0e-3, 3.0e-3]
calibration:       # written by `python -m sim.generate.calibrate` (module 02, G2); ranges above are NOT auto-changed
  done: true
  method: "14 locations x geometric-midpoint area per bucket, fault at 12:00 to end, default diurnal profile, no noise, pipe split 0.5; realised = peak total leak flow / mean junction demand of the episode"
  realised_pct_of_system_demand:
    SMALL_LEAK: {area_m2_midpoint: 4e-05, target_pct: [0, 5], min_pct: 1.9, median_pct: 2.6, max_pct: 3.0, frac_in_band: 1.0, median_in_band: true}
    MEDIUM_LEAK: {area_m2_midpoint: 0.0001414, target_pct: [5, 15], min_pct: 6.7, median_pct: 9.1, max_pct: 10.4, frac_in_band: 1.0, median_in_band: true}
    LARGE_LEAK: {area_m2_midpoint: 0.0003873, target_pct: [15, 25], min_pct: 18.1, median_pct: 24.5, max_pct: 27.4, frac_in_band: 0.71, median_in_band: true}
    PIPE_BURST: {area_m2_midpoint: 0.001732, target_pct: [25, null], min_pct: 78.5, median_pct: 99.9, max_pct: 111.0, frac_in_band: 1.0, median_in_band: true}
fault_locations:
  junctions: ["2", "3", "4", "5", "6", "7"]
  pipes: ["1", "2", "3", "4", "5", "6", "7", "8"]
  pipe_position: [0.2, 0.8]
holdout_test_only: ["pipe:5", "junction:6"]   # D9
splits: {train: 0.70, val: 0.15, test: 0.15}
noise: {pressure_sigma_m: 0.05, flow_sigma_lps: 0.10, missing_rate: 0.0}
num_shards: 8
