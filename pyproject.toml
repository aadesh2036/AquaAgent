[project]
name = "aquaagent"
version = "0.1.0"
description = "AquaAgent — physics-grounded water-network anomaly detection (backbone/1.0.0)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["shared/tests", "sim/tests", "ml/tests", "api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["frontend", "infra/logs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"shared/contracts/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
exclude = ["*.md"]
